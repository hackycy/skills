name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 根 CLI 包级 tag，例如 @hackycy/agent-notes@0.1.0
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      ROOT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Select fixed source
        shell: bash
        run: |
          git check-ref-format "refs/tags/$ROOT_TAG"
          commit=$(git rev-parse --verify "refs/tags/$ROOT_TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main
          git checkout --detach "$commit"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Pin npm with OIDC dist-tag support
        run: npm install --global npm@12.2.1 --ignore-scripts
      - name: Install frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, build, pack, publish and record
        run: pnpm release:execute --tag "$ROOT_TAG" --artifacts-dir "$RUNNER_TEMP/release-artifacts"
      - name: Preserve original artifacts and failure stage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-artifacts/
          if-no-files-found: ignore
