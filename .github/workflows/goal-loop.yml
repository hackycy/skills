name: Goal Loop

on:
  push:
    paths:
      - 'skills/goal-loop/**'
      - .github/workflows/goal-loop.yml
  pull_request:
    paths:
      - 'skills/goal-loop/**'
      - .github/workflows/goal-loop.yml
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s skills/goal-loop/tests -v
