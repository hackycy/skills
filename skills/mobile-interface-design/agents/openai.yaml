interface:
  display_name: mobile interface design
  short_description: Design and implement distinctive mobile-first H5 interfaces from
    product requirements when no UI mockup is available. Use for mobile web pages,
    app WebView screens, forms, lists, detail pages, consumer flows, operational
    tools, and redesigns. Infers product intent and domain-specific visual material,
    explores mobile composition before coding, commits a page-specific signature
    idea and visual contract, builds real UI, and visually critiques the rendered
    result when browser tools are available.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: false
